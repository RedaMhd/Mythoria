<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena</title>
    <link rel="icon" href="../images/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[url(../images/bg.png)]">
    <header></header>
    <main class="h-[100vh] backdrop-blur-lg">
        <div class="grid grid-cols-6 grid-rows-6 gap-5 w-2/3 mx-auto h-full bg-[url(../images/fightingArena.jpg)] bg-no-repeat bg-center bg-cover">

            <div class="plyer1 grid grid-rows-3  col-span-5 row-span-3 gap-1">
                <div class="hand row-span-1 grid grid-cols-5 ">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                </div>

                <div class="tabl row-span-2 grid grid-rows-2 gap-1">
                    <div class="def row-span-1 grid grid-cols-5 gap-1">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"  style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"  style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"  style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"  style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"  style="transform: rotate(90deg);">
                    </div>
                    <div class="atck row-span-1 grid grid-cols-5 gap-1">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    </div>

                </div>
            </div>

            <div class="safCase col-span-1 row-span-6 flex flex-col justify-between">

                <div class="cas1 ">
                    <img src="../images/carts/Aurelion.png" class=" bg-sky-500 h-[90%] mx-auto">
                </div>

                <div class="cas2 ">
                    <img src="../images/carts/Aurelion.png" class=" bg-sky-500 h-[90%] mx-auto">
                </div>
            </div>

            <div class="plyer1 grid grid-rows-3  col-span-5 row-span-3 gap-1">
                <div class="tabl row-span-2 grid grid-rows-2 gap-1">
                    <div class="atck row-span-1 grid grid-cols-5 gap-1">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    </div>
                    <div class="def row-span-1 grid grid-cols-5 gap-1">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"
                            style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"
                            style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"
                            style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"
                            style="transform: rotate(90deg);">
                        <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]"
                            style="transform: rotate(90deg);">
                    </div>

                </div>
                <div class="hand row-span-1 grid grid-cols-5 gap-1 h-full">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                    <img src="../images/carts/Aurelion.png" class="col-span-1 bg-sky-500 h-[50%]">
                </div>


            </div>
        </div>
    </main>

</html>
